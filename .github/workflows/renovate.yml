name: Renovate Dependencies

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
        # TODO: use https://github.com/renovatebot/github-action
      - name: Sync dependencies
        run: uv sync --dev

      - name: Bump dependencies
        run: uv lock --upgrade

      - name: Sync and update pyproject.toml
        run: |
          uv sync --dev
          python scripts/update_dependencies.py

      - name: Run tests
        run: uv run pytest tests/ -x -q

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(deps): bump dependencies"
          title: "chore(deps): bump dependencies"
          body: |
            Automated dependency bump via Renovate workflow.
          branch: chore/bump-deps
          delete-branch: true
          labels: dependencies
